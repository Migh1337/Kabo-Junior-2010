name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-hopper-iyoty0]
    paths: [prototype/**, assets/**, package.json, capacitor.config.json, .github/workflows/build-apk.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Allow camera for photo capture
        run: sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
      - name: Generate app icons from assets/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b1220' --iconBackgroundColorDark '#0b1220'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tachnoball-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
